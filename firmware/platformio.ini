; Benairy wind tunnel controller firmware (Schreiber AI)
; Board: any ESP32 DevKit (ESP32-WROOM-32). No external libraries.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DBENAIRY_FW_VERSION=\"0.1.0\" -std=gnu++17
build_unflags = -std=gnu++11
